{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-box">

        <div class="auth-logo">
            KP PANEL
        </div>

        <div class="auth-subtitle">
            AUTHORIZE ACCESS
        </div>

        <p class="auth-description">
            Login to continue your purchase.
        </p>


        <form method="POST">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button
                type="submit"
                class="main-button"
            >
                LOGIN NOW
            </button>

        </form>


        <div class="auth-footer">

            New user?

            <a href="/register">
                Create Account
            </a>

        </div>

    </div>

</div>

{% endblock %}
